<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    /* Registering the colors lets the browser animate them smoothly */
    @property --c1 { syntax: "<color>"; inherits: false; initial-value: #3a9b7f; }
    @property --c2 { syntax: "<color>"; inherits: false; initial-value: #e8632b; }
    @property --c3 { syntax: "<color>"; inherits: false; initial-value: #f6d04d; }
    @property --c4 { syntax: "<color>"; inherits: false; initial-value: #1f1b1a; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: #fff;

      --c1: #3a9b7f;
      --c2: #e8632b;
      --c3: #f6d04d;
      --c4: #1f1b1a;

      background:
        radial-gradient(ellipse at 0% 75%,  var(--c1) 0%, transparent 55%),
        radial-gradient(ellipse at 65% 95%, var(--c3) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 35%, var(--c2) 0%, transparent 65%),
        var(--c4);

      /* Long, gentle transition = slow flowing color change */
      transition: --c1 2.5s ease-in-out, --c2 2.5s ease-in-out,
                  --c3 2.5s ease-in-out, --c4 2.5s ease-in-out;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    p {
      margin: 0;
      max-width: 36ch;
      font-size: 1.25rem;
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    button {
      font: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 32px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: #222;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease;
    }
    button:hover { transform: scale(1.06); }
    button:active { transform: scale(0.96); }
    #count { font-size: 1rem; opacity: 0.9; text-shadow: 0 2px 8px rgba(0,0,0,0.35); }
  </style>
</head>
<body>
  <h1>Hi there! 👋</h1>
  <p>This is my first website. Click the button and watch the colors flow.</p>
  <button id="btn">Change colors</button>
  <div id="count">Clicks: 0</div>

  <script>
    var btn = document.getElementById("btn");
    var count = document.getElementById("count");
    var clicks = 0;
    var lastHue = 20;

    function newPalette() {
      // pick a hue that is clearly different from the previous one
      var h = (lastHue + 60 + Math.random() * 240) % 360;
      lastHue = h;
      var s = document.body.style;
      s.setProperty("--c1", "hsl(" + h + ", 70%, 45%)");
      s.setProperty("--c2", "hsl(" + ((h + 50) % 360) + ", 85%, 55%)");
      s.setProperty("--c3", "hsl(" + ((h + 100) % 360) + ", 90%, 62%)");
      s.setProperty("--c4", "hsl(" + ((h + 220) % 360) + ", 45%, 14%)");
    }

    btn.addEventListener("click", function () {
      clicks++;
      newPalette();
      count.textContent = "Clicks: " + clicks;
    });
  </script>
</body>
</html>
